# ---- 核心模式 ----

mode: "full"                  # full | update-only | predictions-only | from-predictions | from-juejin
update_data: false            # 仅 mode=full 时有效
start_date: "2026-04-01"
rebalance_days: 10            # 调仓间隔（交易日）
trade_mode: "open"            # open=次日开盘调仓, close=当日收盘调仓
initial_capital: 100000
position_pct: 0.90            # 默认总仓位比例
commission: 0.0003
slippage: 0.001
top_k: 3
weight_strategy: "score_power_3"  # equal | softmax | rank_linear | risk_parity | score_risk | score_risk_v1 | kelly | score_power_3
strategy_params:
  temperature: 1.0            # softmax 温度
  vol_window: 20              # 波动率回看天数

# ---- 模型与序列 ----

# 模型列表（仅全 fold SR > 2.0 的 3 个稳健实验：exp_43, exp_22, exp_5）
models:

  - dir: model/TSCV/bayes_tcn_74_3/exp_43/fold_3
    file: best_model_sharpe.pth
    enabled: true
    name: tcn_43_3
    weight: 2.904

  - dir: model/TSCV/bayes_tcn_74_3/exp_22/fold_3
    file: best_model_sharpe.pth
    enabled: true
    name: tcn_22_3
    weight: 2.420

  - dir: model/TSCV/bayes_tcn_74_3/exp_5/fold_3
    file: best_model_sharpe.pth
    enabled: true
    name: tcn_5_3
    weight: 2.376

  # 以下搜索候选（min_SR > 1.8），回测发现融合稀释信号，保持 disabled
  - dir: model/TSCV/bayes_tcn_74_3/exp_54/fold_3
    file: best_model_sharpe.pth
    enabled: false
    name: tcn_54_3
    weight: 2.508

  - dir: model/TSCV/bayes_tcn_74_3/exp_19/fold_3
    file: best_model_sharpe.pth
    enabled: false
    name: tcn_19_3
    weight: 2.252

  - dir: model/TSCV/bayes_tcn_74_3/exp_28/fold_3
    file: best_model_sharpe.pth
    enabled: false
    name: tcn_28_3
    weight: 2.265

  - dir: model/TSCV/bayes_tcn_74_3/exp_49/fold_3
    file: best_model_sharpe.pth
    enabled: false
    name: tcn_49_3
    weight: 2.315

  - dir: model/TSCV/bayes_tcn_74_3/exp_15/fold_3
    file: best_model_sharpe.pth
    enabled: false
    name: tcn_15_3
    weight: 2.503

# 融合序列
average: true                 # 启用平均模型
voting: true                  # 启用投票模型

# 加权投票 (模型权重取 models[].weight)
wvoting_sr: true

# 子集成 (Rank平均融合)
avg_rank_sub:
  enabled: false
  models: ["tcn_43_3", "tcn_22_3", "tcn_5_3"]
  weight_strategy: "score_power_3"
  position_pct: 0.90

# 子集成 (Score平均融合)
avg_score_sub:
  enabled: false
  models: ["tcn_43_3", "tcn_22_3", "tcn_5_3"]
  weight_strategy: "score_power_3"
  position_pct: 0.50

# Sharpe加权子集成 — 仅 3 个全 fold SR > 2.0 稳健实验
# 系统搜索验证：top3_only/score_power_3 最优 40.26%/4.76SR
# 添加更多实验（exp_19/33.23%, exp_49/22.02%）反而稀释融合信号
sharpe_weighted_sub:
  enabled: true
  models: ["tcn_43_3", "tcn_22_3", "tcn_5_3"]
  weight_strategy: "score_power_3"
  position_pct: 0.90

# 主序列
#   first              → 自动选第一个启用模型
#   juejin             → 掘金回测
#   average            → 平均模型
#   voting             → 投票模型
#   wvoting_sr         → 加权投票
#   avg_rank_sub       → Rank平均子集成
#   avg_score_sub      → Score平均子集成
#   sharpe_weighted_sub → Sharpe加权子集成
#   <model_key>        → 指定模型
master: "sharpe_weighted_sub"

# ---- 掘金策略 ----
juejin:
  start_date: "2026-01-01"
  rebalance_days: 10
  trade_mode: "open"
  top_k: 3
  weight_strategy: "score_power_3"
  strategy_params:
    vol_window: 20
  position_pct: 0.90

# ---- 风控 ----
risk_manager:
  enabled: true
  strategy: "market_breadth"
  params:
    lookback_days: 11
    high_threshold: 0.16
    low_threshold: 0.07

